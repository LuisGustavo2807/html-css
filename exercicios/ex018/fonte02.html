<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fontes externas</title>
    <style>
        @font-face {
            font-family: 'love' ;
            src: url(font/love\ larry\ ttf.ttf); format(truetype)
            font-weight: normal;
            font-style: normal;
            /*
            tipos de format()
            - opentype (otf)
            - truetype (ttf)
            - embedded-opentype
            - truetype-aat(apple advanced typography)
            - svg
            
            */
            
        }
        body{
     font-family: Arial, Helvetica, sans-serif;
        }
        h1{
     font-family: 'love',times,serif;
     font-size: 3em;
     font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>titulos</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Officiis, minus. Tempora, ipsum ullam veniam maxime quidem reprehenderit iste itaque. Obcaecati dolores suscipit optio autem delectus. Sed, quis veritatis. Fuga, maxime.</p>
    
</body>
</html>
