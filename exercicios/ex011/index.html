<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mídias em html 5</title>
</head>
<body>
    <h1>imagem dinamica</h1>
    <p>Tente abrir esse site em varios dispositivos diferentes  ou simplesmente aumente e diminua o tamanho do seu navegador.</p>
    <picture>
        <source media="(min-width:1050px )" srcset="imagens/foto-p.png" type="image/png">
        <source media="(min-width:750px )" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="imagens flexivel">
    </picture>
    <h1>reproduzindo áudio</h1>
    <p>vamos aprender a reproduzir áudios em HTML 5.</p>
    <audio src="midia/happy-mistake.mp3" controls autoplay></audio><!---uma das maneiras--->
<audio preload="metadata" autoplay controls loop> 
    <source src="midia/happy-mistake.mp3" type="áudio/mpeg">
    <source src="midia/guanacast-33.mp3" type="audio/mpeg">
    <source src="midia/guanacast-33.ogg" type="áudio/ogg">
    <source src="midia/guanacast-33.wav" type="áudio/wav">
    <!---tipos aceito de formatos de áudios (mpeg/ogg/wav-->
    <p>infelizmente seu navegador não consegue reproduzir áudio. <a href="midia/guanacast-33.mp3">clique aqui para baixar o arquivo MP3</a> </p>
</audio>
</body>
</html>
