<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        /*
        #  = id
        .  = class
        :  = pseudo-class
        :: = pseudo-elemento
        >  = clildren
        */
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        a{
            color:  red;
            text-decoration: none;
            font-weight: bold;
        }
        a:visited{
            color: blueviolet;
        }
        a:hover{
            color: black;
            text-decoration: underline;
        }
        a:active{
            color: yellow;
        }
        .especial::after{
        content: '🔗';
        text-decoration: none;
        font-weight:normal;
        color: darkgrey;
        }
        .especial{
            background-color: rgb(57, 182, 182);
            
        }
    </style>
</head>
<body>
    <h1>personalizado links</h1>
    <ul>
    <li><a href="https://gustavoguanabara.github.io"target=blank_>repositorio do github</a></li>
    <li> <a href="https://youtube.com/cursoemvideo/" class="especial">canal no youtube</a></li>
    <li><a href="https://www.cursoemvideo.com">Site do curso em video</a> </li>
    </ul>
</body>
</html>
