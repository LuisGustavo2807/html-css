<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagem flexível</title>
</head>
<body>
    <h1>imagem flexível</h1>
    <p>Voce está vendo a imagem completa? Experimente ampliar o tamanho da sua janela para aproveitar a melhor experiencia &#x1F92F;</p>
   <picture>
    <source media="(min-width:1080px )" srcset="imagens/paisagem.g.jpg" type="image/jpg">

     <source media="(min-width:60px)" srcset="imagens/paisagem.p.jpg" type="image/jpg">

   </picture>
