<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabela</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        
        }
        table{
            border-collapse: collapse;
        }
        
        th,td{
            border: 1px solid rgb(0, 0, 0);
            padding: 5px;
        }
        th{
            background-color: darkgrey;
            color: white;
            padding: 10px; }
            
        
        td.mat{
            text-align: center;
        }
        th.titu{
            text-align: left;
        }
        td.es{
            text-align: center;
        }
        
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th rowspan="2" scope="row">Área</th>
                <th rowspan="2" scope="row">Disciplinas</th>
                <th colspan="2" scope="colgroup">notas</th>
                <th rowspan="4" scope="col">media</th>
            </tr>
            <tr>
                <th scope="col">nota 1</th>
                <th scope="col">nota 2</th>
            </tr>
         <tbody>
         </tbody>
         <tr>
             <td rowspan="5"scope="rowgroup" class="es">exatas</td>
         </tr>
         <tr>
            <td>Matematica</td>
            <td class="mat">0.0</td>
            <td class="mat">0.0</td>
            <td class="mat">0.0</td>
         </tr>
         <tr>
            <td>Fisica</td>
            <td class="mat">0.0</td>
            <td class="mat">0.0</td>
            <td class="mat">0.0</td>
         </tr>
         <tr>
            <td>Quimica</td>
            <td class="mat">0.0</td>
            <td class="mat">0.0</td>
            <td class="mat">0.0</td>
         </tr>
         <tr>
            <td>Biologia</td>
            <td class="mat">0.0</td>
            <td class="mat">0.0</td>
            <td class="mat">0.0</td>
         </tr>
         <tr>
            <th colspan="4" class="titu">media de exatas</th>
            <th>0.0</th>
         </tr>
         <tr>
            <td rowspan="3"scope="rowgroup" class="es">humanas</td>
         </tr>
         <tr>
            <td>Historia</td>
            <td class="mat">0.0</td>
            <td class="mat">0.0</td>
            <td class="mat">0.0</td>
         </tr>
         <td>Geografia</td>
         <td class="mat">0.0</td>
         <td class="mat">0.0</td>
         <td class="mat">0.0</td>
         <tr>
           <th colspan="4" class="titu">media de humanas</th>
           <th>0.0</th>
         </tr>
        </thead>
    </table>
</body>
</html>
